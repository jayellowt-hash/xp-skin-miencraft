<!DOCTYPE html>
<html>
<head>
<title>Minecraft XP Skin Generator</title>

<style>

body{
font-family:Arial;
background:#87CEEB;
text-align:center;
margin:0;
}

header{
background:#2e8b57;
color:white;
padding:20px;
font-size:35px;
}

.section{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}

button{
padding:12px 25px;
font-size:18px;
cursor:pointer;
margin:10px;
}

#skin{
margin-top:20px;
width:200px;
image-rendering:pixelated;
}

</style>

<script>

let xp = 0;

const skins = [
"https://minotar.net/skin/Notch",
"https://minotar.net/skin/Herobrine",
"https://minotar.net/skin/Dinnerbone",
"https://minotar.net/skin/Technoblade",
"https://minotar.net/skin/Dream",
"https://minotar.net/skin/Skeleton",
"https://minotar.net/skin/Zombie",
"https://minotar.net/skin/Steve",
"https://minotar.net/skin/Alex"
];

function gainXP(){

xp += 10;

document.getElementById("xp").innerText = xp;

if(xp % 100 === 0){

let randomSkin = skins[Math.floor(Math.random()*skins.length)];

document.getElementById("skin").src = randomSkin;

alert("You unlocked a random Minecraft skin!");

}

}

</script>

</head>

<body>

<header>
Minecraft XP Skin Generator
</header>

<div class="section">

<h2>Your XP</h2>

<h1 id="xp">0</h1>

<button onclick="gainXP()">Gain XP</button>

<p>Every 100 XP you unlock a random skin!</p>

<img id="skin">

</div>

</body>

</html>
